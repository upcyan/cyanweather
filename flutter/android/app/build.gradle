plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = file("../../../keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.cyanweather.cyanweather_flutter"
    compileSdk = 36
    // sdkmanager 在本机装 build-tools 35 会装成半残（缺 aapt2），显式用已装好的 36
    buildToolsVersion = "36.0.0"
    // 插件均为纯 Dart/Kotlin，无需编译 native；固定到本机已安装的 NDK，
    // 避免 Flutter 工具每次构建都尝试下载默认 r27（sdkmanager 在 Windows 上装不稳）。
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.cyanweather.cyanweather_flutter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file("../../../keystore/release-key.jks")
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // shared_preferences 2.5.x 的 JNIgen 依赖 Kotlin 协程/Result 等
            // 只在 JNI 侧按名字查找的类，R8 会持续裁掉（NoSuchMethod /
            // ClassNotFound）。关掉 minify 换取稳定启动，体积只增加几 MB。
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
