name: Build Release APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定 3.47.1：flutter/android/settings.gradle 引入的 .tools 修补版
          # flutter_tools gradle 按该版本打补丁，换版本可能不兼容
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release-key.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Native APK
        run: ./gradlew assembleRelease

      - name: Build Flutter APK
        working-directory: flutter
        run: flutter build apk --release

      # WebF 版自 2026-10-21 起弃用：目录保留，但不再构建、不再发布 APK

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cyanweather-${{ github.ref_name }}-release.apk"
          cp flutter/build/app/outputs/flutter-apk/app-release.apk "dist/cyanweather-flutter-experimental-${{ github.ref_name }}-release.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
