name: Build Release APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release-key.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew capacitor/android/gradlew

      - name: Build Native APK
        run: ./gradlew assembleRelease

      - name: Build Flutter APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Build Capacitor APK
        working-directory: capacitor
        run: |
          npm ci
          cd android
          ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/cyanweather-v1.0-release.apk
          cp flutter/build/app/outputs/flutter-apk/app-release.apk dist/cyanweather-flutter-experimental-v1.0-release.apk
          cp capacitor/android/app/build/outputs/apk/release/app-release.apk dist/cyanweather-capacitor-experimental-v1.0-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v1.0
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}