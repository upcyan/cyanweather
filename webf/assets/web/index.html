    <main id="content" class="error-mode-hidden-by-default">
      <div id="errorBox"></div>
      <div id="noticeBox"></div>
      <!-- 以下均为常驻挂载点：内容由 JS 以 innerHTML 注入/清空（webf 渲染可靠通道） -->
      <div id="warnMount"></div>
      <div id="minutelyMount"></div>

      <!-- 主天气卡片 -->
      <section class="main-card card" id="mainCard">
        <div class="main-row">
          <div class="main-left">
            <div class="weather-glyph" id="weatherGlyph">☁️</div>
            <div class="condition" id="curCond">—</div>
          </div>
          <div class="main-right">
            <div class="temp"><span id="curTemp">--</span><span class="unit" id="curUnit">°C</span></div>
          </div>
        </div>
        <div class="stats-row" id="statsRow">
          <div class="stat-col">
            <span class="stat-label">最高</span>
            <span class="stat-value stat-high" id="todayHigh">--</span>
          </div>
          <div class="stat-col">
            <span class="stat-label">最低</span>
            <span class="stat-value stat-low" id="todayLow">--</span>
          </div>
          <div class="stat-col">
            <span class="stat-label">体感</span>
            <span class="stat-value stat-feel" id="feelsLike">--</span>
          </div>
        </div>
      </section>

      <!-- 降雨提醒与趋势：紧随当前天气卡，点击后原位展开 -->
      <div id="rainTipMount"></div>
      <div id="rainBlockMount"></div>

      <!-- 日出日落 -->
      <section class="sun-card card" id="sunCard">
        <div class="sun-col">
          <span class="sun-label">日出</span>
          <span class="sun-value" id="sunrise">--</span>
        </div>
        <div class="sun-col">
          <span class="sun-label">日落</span>
          <span class="sun-value" id="sunset">--</span>
        </div>
      </section>

      <!-- 信息卡片列：湿度 / 风力 / 空气质量 / 紫外线 -->
      <section class="info-list" id="infoList">
        <div class="info-card card">
          <span class="info-label">湿度</span>
          <span class="info-value" id="humidityVal">--</span>
        </div>
        <div class="info-card card">
          <span class="info-label">风力</span>
          <span class="info-value" id="windVal">--</span>
        </div>
        <div class="info-card card">
          <span class="info-label">空气质量</span>
          <span class="info-value" id="aqiVal">--</span>
        </div>
        <div class="info-card card">
          <span class="info-label">紫外线强度</span>
          <span class="info-value" id="uvVal">--</span>
        </div>
      </section>

      <!-- 逐小时预报 -->
      <section class="block">
        <h3 id="hourlyLabel">未来48小时逐时预报</h3>
        <div class="hourly scroll-x" id="hourly"></div>
      </section>

      <!-- 多日预报 -->
      <section class="block">
        <h3 id="dailyLabel">未来多日预报（7天）</h3>
        <div class="daily" id="daily"></div>
      </section>

      <!-- 昨日天气（挂载点） -->
      <section class="block">
        <h3>昨日天气</h3>
        <div id="yesterdayMount"></div>
      </section>

      <!-- 数据来源底部 -->
      <div class="source-footer" id="sourceFooter">数据来源：Open-Meteo</div>
    </main>
  </div>

  <!-- 弹层挂载点：内容（含 .modal 结构）由 JS 注入 -->
  <div id="cascadeMount"></div>
  <div id="searchMount"></div>
  <div id="settingsMount"></div>
  <div id="updateMount"></div>

  <!-- 全局刷新遮罩（body 级，覆盖含顶栏的整屏；内容由 JS 注入） -->
  <div id="refreshMount"></div>

  <script src="app.js"></script>
</body>
</html>
