<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>晴暖天气</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
    <header>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
        <h1 id="cityName">晴暖天气</h1>
        <button class="icon-btn" onclick="loadWeather()">🔄</button>
    </header>
    <main>
        <div class="loading" id="loading"><div class="spinner"></div><p>正在获取天气...</p></div>
        <div class="error" id="error" style="display:none"></div>
        <div id="weatherData" style="display:none">
            <div class="location-notice" id="locationNotice" style="display:none"><span id="locationNoticeText"></span><button id="locationNoticeAction"></button></div>
            <div class="rain-card" id="rainCard" style="display:none">🌂 <span>近期可能有雨，请留意天气变化</span></div>
            <div class="main-weather">
                <div class="weather-icon" id="mainIcon">☁</div>
                <div class="temperature" id="mainTemp">--°</div>
                <div class="condition" id="mainCondition">--</div>
            </div>
            <div class="stat-row"><div class="stat"><span class="label">最高</span><span class="value high" id="high">--°</span></div><div class="stat"><span class="label">最低</span><span class="value low" id="low">--°</span></div></div>
            <div class="feels-like" id="feelsLike"></div>
            <div class="stat-row"><div class="stat"><span class="label">日出</span><span class="value" id="sunrise">--</span></div><div class="stat"><span class="label">日落</span><span class="value" id="sunset">--</span></div></div>
            <div class="info-cards" id="infoCards"></div>
            <div class="section-title">逐时预报</div>
            <div class="hourly-scroll" id="hourly"></div>
            <div class="section-title" id="dailyTitle">多日预报</div>
            <div id="daily"></div>
            <div class="source" id="source"></div>
        </div>
    </main>
    <div id="settingsPanel" class="panel" style="display:none">
        <div class="panel-header"><button onclick="closeSettings()">← 返回</button><h2>设置</h2></div>
        <div class="panel-body">
            <h3>天气数据源</h3>
            <label class="radio"><input type="radio" name="source" value="openmeteo" checked onchange="saveSetting('source',this.value)"> Open-Meteo（免费）</label>
            <label class="radio"><input type="radio" name="source" value="nmc" onchange="saveSetting('source',this.value)"> 中国气象局（免费）</label>
            <h3>字体大小</h3>
            <label class="radio"><input type="radio" name="font" value="standard" onchange="saveSetting('fontSize',this.value)"> 标准</label>
            <label class="radio"><input type="radio" name="font" value="large" checked onchange="saveSetting('fontSize',this.value)"> 大（推荐）</label>
            <label class="radio"><input type="radio" name="font" value="xlarge" onchange="saveSetting('fontSize',this.value)"> 特大</label>
            <h3>自动刷新</h3>
            <label class="radio"><input type="radio" name="refresh" value="off" onchange="saveSetting('refreshInterval',this.value)"> 关闭</label>
            <label class="radio"><input type="radio" name="refresh" value="10" onchange="saveSetting('refreshInterval',this.value)"> 每 10 分钟</label>
            <label class="radio"><input type="radio" name="refresh" value="30" checked onchange="saveSetting('refreshInterval',this.value)"> 每 30 分钟（推荐）</label>
            <label class="radio"><input type="radio" name="refresh" value="60" onchange="saveSetting('refreshInterval',this.value)"> 每 60 分钟</label>
            <h3>定位</h3>
            <label class="switch"><input type="checkbox" id="useGps" checked onchange="saveSetting('useGps',this.checked);refreshLocation()"><span>使用当前位置</span></label>
            <h3>自动检查更新</h3>
            <label class="switch"><input type="checkbox" id="autoUpdate" checked onchange="saveSetting('autoCheckUpdate',this.checked)"><span>进入App时检查GitHub新版本</span></label>
            <div class="about"><p><strong>晴暖天气 v1.1</strong></p><p>为长辈设计的简洁大字天气应用</p><p>数据来源：Open-Meteo / 中央气象台</p></div>
        </div>
    </div>
</div>
    <script src="js/config.js"></script>
    <script src="js/render.js"></script>
    <script src="js/update.js"></script>
</body>
</html>
